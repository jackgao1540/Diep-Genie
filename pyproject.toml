[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "genie-diep"
version = "0.1.0"
description = "Small experimental video-only world model for diep.io"
requires-python = ">=3.11"
dependencies = ["torch>=2.5", "numpy>=1.26", "Pillow>=10", "opencv-python-headless>=4.10"]

[project.optional-dependencies]
data = ["yt-dlp[default]", "imageio-ffmpeg", "psutil"]
curation = ["rapidocr==3.10.0", "onnxruntime>=1.31"]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["genie_diep*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
